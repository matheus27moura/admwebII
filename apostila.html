<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Apostila PHP na Prática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  /* ---------- Apostila: leitura na tela e impressão ---------- */
  .apostila { max-width: 820px; margin: 0 auto; padding: 32px 16px 80px; }
  .barra-acoes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 24px; }
  .capa { min-height: 88vh; display: flex; flex-direction: column; justify-content: center; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
  .capa .marca { width: 64px; height: 64px; border-radius: 14px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 1rem var(--mono); margin-bottom: 32px; }
  .capa h1 { font-size: 3rem; margin-bottom: 12px; }
  .capa .sub { font-size: 1.25rem; color: var(--text-2); max-width: 560px; }
  .capa .info { margin-top: 48px; color: var(--text-2); font-size: .95rem; line-height: 1.9; }
  .sumario ol { padding-left: 0; list-style: none; }
  .sumario li { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px dotted var(--border); }
  .sumario li span:first-child { font: 600 .9rem var(--mono); color: var(--accent); width: 32px; }
  .capitulo { border-top: 1px solid var(--border); margin-top: 56px; padding-top: 32px; }
  .capitulo > .eyebrow { font: 600 .8rem var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
  .capitulo > h1 { font-size: 2rem; margin: 6px 0 8px; }
  .capitulo > .lead { color: var(--text-2); font-size: 1.05rem; }
  .capitulo h2 { font-size: 1.35rem; }
  .listagem-titulo { font: 600 .85rem var(--mono); margin: 18px 0 6px; color: var(--text-2); }
  .anotacoes { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-height: 160px; background: repeating-linear-gradient(var(--surface), var(--surface) 31px, var(--border) 32px); }

  @page { size: A4; margin: 16mm 15mm 18mm; @bottom-right { content: counter(page); font: 9pt Inter, sans-serif; color: #888; } }
  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { font-size: 10.5pt; background: #fff; }
    .topbar, .barra-acoes, .rodape, .codigo-topo button, .codigo-topo a { display: none !important; }
    .apostila { max-width: none; padding: 0; }
    .capa { min-height: 250mm; border: 0; margin: 0; }
    .capitulo, .quebra { break-before: page; border-top: 0; margin-top: 0; padding-top: 0; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 8.4pt; }
    .codigo, .callout, .desafio, .compara, .fluxo, table, .modelo-box { break-inside: avoid; }
    .codigo.longo { break-inside: auto; }
    h2, h3 { break-after: avoid; }
    a { color: inherit; }
    .compara { grid-template-columns: 1fr 1fr; }
    .aula-item, .card { box-shadow: none; }
  }
</style>
</head>
<body>
<div id="topo"></div>
<main class="apostila" id="apostila"></main>
<div id="rodape"></div>

<script src="assets/js/render.js"></script>
<script src="assets/js/aulas/aula01.js"></script>
<script src="assets/js/aulas/aula02.js"></script>
<script src="assets/js/aulas/aula03.js"></script>
<script src="assets/js/aulas/aula04.js"></script>
<script src="assets/js/aulas/aula05.js"></script>
<script src="assets/js/aulas/aula06.js"></script>
<script src="assets/js/aulas/aula07.js"></script>
<script src="assets/js/aulas/aula08.js"></script>
<script src="assets/js/aulas/aula09.js"></script>
<script src="assets/js/aulas/aula10.js"></script>
<script src="assets/js/apendices.js"></script>
<script src="assets/js/ide/projeto-etapas.js"></script>
<script>
  R.ordenar();
  document.getElementById('topo').innerHTML = R.cabecalho('apostila');
  document.getElementById('rodape').innerHTML = R.rodape();
  const extensoLang = { php: 'php', css: 'css', js: 'js', html: 'html', json: 'js' };
  let h = '<div class="barra-acoes"><a class="btn" href="downloads/apostila-php-na-pratica.pdf" download>Baixar PDF</a>' +
    '<button class="btn primario" type="button" onclick="print()">Imprimir / Salvar como PDF</button></div>';

  // Capa
  h += '<section class="capa"><div class="marca">&lt;?php</div><h1>PHP na Prática</h1>' +
    '<p class="sub">Apostila do aluno — do site estático ao site dinâmico, em 10 aulas com projetos reais.</p>' +
    '<div class="info">Curso Técnico em Desenvolvimento de Sistemas<br>Programação Web II — continuação de HTML, CSS e JavaScript<br>10 aulas de 2 horas · laboratório online · desafios</div>' +
    '<div class="info" style="margin-top:32px">Nome: _______________________________________ &nbsp; Turma: ________</div></section>';

  // Sumário
  h += '<section class="sumario"><h2 style="margin-top:0">Sumário</h2><ol>' +
    '<li><span>00</span><span>Antes de começar: como estudar e usar o laboratório</span></li>' +
    AULAS.map(a => '<li><span>' + R.pad(a.n) + '</span><span>' + a.titulo + ' <span class="muted">— projeto: ' + a.modelo.nome + '</span></span></li>').join('') +
    '<li><span>P</span><span>Projeto da disciplina: Patas &amp; Cia em 10 etapas</span></li>' +
    '<li><span>A</span><span>Apêndice A — Referência rápida: PHP comparado com JavaScript</span></li>' +
    '<li><span>B</span><span>Apêndice B — Erros comuns e como resolver</span></li>' +
    '<li><span>C</span><span>Apêndice C — Rodando no seu computador com XAMPP</span></li>' +
    '<li><span>D</span><span>Apêndice D — Glossário</span></li></ol></section>';

  // Introdução
  h += '<section class="capitulo"><div class="eyebrow">Capítulo 00</div><h1>Antes de começar</h1>' + R.blocos(APENDICES.intro) + '</section>';

  // Aulas
  AULAS.forEach(a => {
    h += '<section class="capitulo"><div class="eyebrow">Aula ' + R.pad(a.n) + '</div><h1>' + a.titulo + '</h1><p class="lead">' + a.resumo + '</p>';
    h += '<h2>Objetivos</h2><ul class="objetivos">' + a.objetivos.map(o => '<li>' + o + '</li>').join('') + '</ul>';
    a.secoes.forEach(s => { h += '<h2>' + s.titulo + '</h2>' + R.blocos(s.blocos); });
    h += '<h2>Projeto da aula: ' + a.modelo.nome + '</h2><p>' + a.modelo.descricao + '</p>' +
      '<p class="muted small">No laboratório: escolha "Aula ' + R.pad(a.n) + ' — ' + a.modelo.nome + '". A listagem completa dos arquivos está abaixo.</p>' +
      R.blocos(a.modeloTexto || []);
    Object.entries(a.modelo.arquivos).forEach(([nome, cod]) => {
      const html = R.codigo({ code: cod, lang: extensoLang[nome.split('.').pop()] || 'txt', file: nome });
      h += html.replace('class="codigo"', 'class="codigo longo"');
    });
    h += '<h2>Desafios</h2>' + a.desafios.map((d, i) => '<div class="desafio"><div class="desafio-topo"><span class="nivel ' +
      ({ 'Básico': 'basico', 'Intermediário': 'intermediario', 'Avançado': 'avancado' }[d.nivel]) + '">' + d.nivel + '</span><h3>' + (i + 1) + '. ' + d.titulo + '</h3></div>' +
      R.paragrafos(d.texto) + (d.dica ? '<p class="muted small"><b>Dica:</b> ' + d.dica + '</p>' : '') + '</div>').join('');
    h += '<h2>Para revisar</h2><ul>' + a.revisao.map(r => '<li>' + r + '</li>').join('') + '</ul>';
    h += '<h3>Minhas anotações</h3><div class="anotacoes"></div>';
    h += '</section>';
  });

  // Projeto da disciplina: roteiro (sem código, para não virar cola)
  const mdl = (s) => R.esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  h += '<section class="capitulo"><div class="eyebrow">Projeto da disciplina</div><h1>Patas &amp; Cia: o site que você constrói aula a aula</h1>' +
    '<p class="lead">Você recebe o site de um pet shop pronto em HTML, CSS e JavaScript. A cada aula, escreve uma parte do PHP. Na etapa 10, o site estará completo: catálogo com busca, agendamento sem conflitos, área restrita, APIs e atendimento por WhatsApp.</p>' +
    '<p>Faça cada etapa na <b>IDE do curso</b> (aba "Projeto da disciplina"). Ela verifica os requisitos automaticamente e libera dicas aos poucos. Marque aqui o que já concluiu.</p>';
  PROJETO_ETAPAS.forEach(e => {
    h += '<h2>Etapa ' + e.n + ' · ' + R.esc(e.titulo) + ' <span class="muted small">(Aula ' + R.pad(e.aula) + ')</span></h2>' +
      '<p class="muted small">Conceitos: ' + R.esc(e.conceitos) + '</p>' +
      e.contexto.map(p => '<p>' + mdl(p) + '</p>').join('') +
      '<ol>' + e.tarefas.map(t => '<li>' + mdl(t) + '</li>').join('') + '</ol>' +
      '<p><b>Requisitos verificados pela IDE</b></p><ul style="list-style:none;padding-left:0">' + e.requisitos.map(r => '<li>&#9744; ' + mdl(r.texto) + '</li>').join('') + '</ul>';
  });
  h += '</section>';

  // Apêndices
  h += '<section class="capitulo"><div class="eyebrow">Apêndice A</div><h1>Referência rápida: PHP comparado com JavaScript</h1>' + R.blocos(APENDICES.referencia) + '</section>';
  h += '<section class="capitulo"><div class="eyebrow">Apêndice B</div><h1>Erros comuns e como resolver</h1>' + R.blocos(APENDICES.erros) + '</section>';
  h += '<section class="capitulo"><div class="eyebrow">Apêndice C</div><h1>Rodando no seu computador com XAMPP</h1>' + R.blocos(APENDICES.xampp) + '</section>';
  h += '<section class="capitulo"><div class="eyebrow">Apêndice D</div><h1>Glossário</h1>' + R.blocos(APENDICES.glossario) + '</section>';

  document.getElementById('apostila').innerHTML = h;
  R.ativarCodigos(document);
  document.body.dataset.pronto = '1';
</script>
</body>
</html>
